<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Entretenimento Digital</title>
    <!-- 1. CSS Externo -->
    <link rel="stylesheet" type="text/css" href="estilo.css">
</head>
<body>
    <!-- Exemplo de ID -->
    <h1 id="titulo-principal">Portal de Entretenimento Digital</h1>

<div class="container">
        
    <!-- Coluna de Filmes -->
    <div class="filmes">
        <h2>Filmes e Séries</h2>
        
        <div class="card">
            <img src="re26poster.jpeg" alt="Resident Evil" class="poster">
            <h3>Resident Evil</h3>
            <a href="https://www.imdb.com/title/tt35538033/" class="link-saber-mais">Saber mais</a>
        </div>

        <div class="card">
            <img src="estranho.png" alt="Um Estranho no Ninho" class="poster">
            <h3>Um Estranho no Ninho</h3>
            <a href="https://www.imdb.com/title/tt0073486/" class="link-saber-mais">Saber mais</a>
        </div>
    </div>

    <!-- Coluna de Músicas -->
    <div class="musicas">
        <h2>Música e Podcasts</h2>
        <div class="card">
            <img src="spotify.png" alt="Spotify" class="poster">
            <h3>Podcasts</h3>
            <a href="https://open.spotify.com/" class="link-saber-mais">Saber mais</a>
        </div>
        
        <div class="card">
            <img src="ytmusic.png" alt="Youtube" class="poster">
            <h3>Músicas</h3>
            <a href="https://music.youtube.com/" class="link-saber-mais">Saber mais</a>
        </div>
        
    </div>

    <!-- Coluna de Games -->
    <div class="games">
        <h2>Games e Tecnologia</h2>
        <div class="card">
            <img src="wowroms.png" alt="Games" class="poster">
            <!-- Aplicando o CSS inline aqui -->
			<h3 style="color: black;">Emuladores e Games</h3>
            <a href="www.wowroms.com" class="link-saber-mais">Saber mais</a>
        </div>
        <div class="card">
            <img src="techtudo.png" alt="Tecnologia" class="poster">
			<h3 style="color: black;">Tecnologia</h3>
            <a href="https://www.techtudo.com.br/" class="link-saber-mais">Saber mais</a>
        </div>
    </div>

</div>
</body>
</html>
